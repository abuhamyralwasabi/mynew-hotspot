<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetPro | مدير الإعدادات</title><style>body{font-family:Tahoma;background:#12051b;color:#fff;max-width:1000px;margin:auto;padding:20px}textarea{width:100%;min-height:70vh;background:#1d0c2b;color:#fff;border:1px solid #444;border-radius:12px;padding:14px;direction:ltr}button{padding:10px 15px;margin:5px;border:0;border-radius:10px;background:#0084ff;color:#fff;font-weight:700}p{color:#aaa}</style></head><body><h1>مدير إعدادات NetPro</h1><p>هذه أداة محلية لتحرير ملف config.js. افتح الملف ثم عدّل البيانات واضغط تنزيل.</p><input id="file" type="file" accept=".js,.txt"><button id="download">تنزيل config.js</button><textarea id="editor" spellcheck="false"></textarea><script>var e=document.getElementById('editor'),f=document.getElementById('file');f.onchange=function(){var r=new FileReader();r.onload=function(){e.value=r.result};r.readAsText(f.files[0])};document.getElementById('download').onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([e.value],{type:'text/javascript'}));a.download='config.js';a.click()};</script></body></html>
