<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>NetPro | تسجيل الدخول</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/hot-blocker.js" login-error="$(error)" try-count="6" block-time="2"></script>
</head>
<body>
  <main class="page-root">
    <section class="tab-content active">
      <div class="page-message glass-card">
        <div class="icon">⚠️</div>
        <h1>تعذر تسجيل الدخول</h1>
        <p id="routerError">$(error)</p>
        <p style="margin-top:10px">سيتم إعادتك إلى صفحة الدخول لعرض سبب الخطأ وإعادة المحاولة.</p>
        <a id="retry" class="btn btn-login" href="$(link-login)">🔄 العودة إلى صفحة الدخول</a>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var errorNode = document.getElementById('routerError');
      var error = errorNode ? String(errorNode.textContent || '').trim() : '';
      var target = '$(link-login)';
      var separator = target.indexOf('?') >= 0 ? '&' : '?';

      if (!error || !target) return;

      /*
       * Dual authentication:
       *   1) The portal tries the preferred source.
       *   2) On a source/authentication failure, auth.js prepares exactly one
       *      opposite-source attempt (RADIUS <-> local).
       *   3) Only after both paths fail is the normal Arabic error shown.
       */
      var auth = window.NETPRO_AUTH;
      var fallback = null;

      if (auth && typeof auth.shouldFallback === 'function' && auth.shouldFallback(error)) {
        fallback = auth.prepareFallback();

        if (fallback && typeof auth.saveAttempt === 'function') {
          auth.saveAttempt(fallback);
        }
      } else if (auth && typeof auth.clearAttempt === 'function') {
        auth.clearAttempt();
      }

      if (fallback && fallback.mode) {
        var fallbackQuery = [
          'hs_dual_fallback=1',
          'hs_auth_mode=' + encodeURIComponent(fallback.mode)
        ].join('&');

        setTimeout(function () {
          location.replace(target + separator + fallbackQuery);
        }, 30);
        return;
      }

      setTimeout(function () {
        location.replace(target + separator + 'hs_error=' + encodeURIComponent(error));
      }, 30);
    });
  </script>
</body>
</html>
