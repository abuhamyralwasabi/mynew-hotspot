<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>NetPro | تم الدخول بنجاح</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var pending = null;
      try {
        pending = JSON.parse(sessionStorage.getItem('netpro_pending_reauth') || 'null');
      } catch (e) {}

      var target = '$(link-status)';
      var isReauth = pending && pending.auto;
      var card = '$(username)';
      var selectedSpeed = '$(domain)';

      function rememberSuccessfulCard() {
        if (!card) return;

        var record = {
          card: card,
          speed: selectedSpeed || '$(domain)',
          usedAt: Date.now()
        };

        try {
          localStorage.setItem('netpro_last_card', JSON.stringify(record));
          localStorage.setItem('netpro_status_speed:' + card, record.speed);
          if (record.speed) localStorage.setItem('netpro_status_speed', record.speed);

          var stored = JSON.parse(localStorage.getItem('netpro_card_history') || '{"cards":[]}');
          if (!stored || !Array.isArray(stored.cards)) stored = { cards: [] };

          stored.cards = stored.cards.filter(function (item) {
            return item && item.card !== card;
          });
          stored.cards.unshift(record);
          stored.cards = stored.cards.slice(0, 5);
          localStorage.setItem('netpro_card_history', JSON.stringify(stored));
        } catch (e) {}
      }

      rememberSuccessfulCard();

      if (isReauth) {
        try {
          sessionStorage.removeItem('netpro_pending_reauth');
        } catch (e) {}

        setTimeout(function () {
          location.replace(target);
        }, 1700);
        return;
      }

      setTimeout(function () {
        location.replace(unescape('$(link-redirect-esc)'));
      }, 100);
    });
  </script>
</head>
<body>
  <main class="page-root">
    <section class="tab-content active">
      <div class="page-message glass-card">
        <div class="icon">✅</div>
        <h1>تم تسجيل دخولك بنجاح</h1>
        <p>جاري تجهيز اتصالك بالسرعة المختارة…</p>
        <p><a href="$(link-status)">فتح حالة الاتصال</a></p>
      </div>
    </section>
  </main>
</body>
</html>
